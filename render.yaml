services:
  - type: web
    name: smartwork-backend
    plan: free
    env: python
    healthCheckPath: /health
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      # Chuỗi kết nối MongoDB — đặt thủ công trong bảng điều khiển Render,
      # không ghi vào tệp này
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: smartwork
      # Khoá ký thẻ truy cập. Render tự sinh; đổi khoá sẽ làm mọi phiên đăng
      # nhập hiện có hết hiệu lực
      - key: SECRET_KEY
        generateValue: true
      # Địa chỉ giao diện được phép gọi API. Bắt buộc đặt sau khi có tên miền
      # thật của bản triển khai giao diện, ví dụ:
      #   https://smartwork-ai.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Cờ này chỉ mở khoá danh sách mật khẩu mặc định phổ biến
      # (admin123, 123456, password, 12345678). Để "false" trên bản công khai.
      #
      # LƯU Ý: dữ liệu mẫu hiện dùng mật khẩu "123456789a", CỐ Ý nằm ngoài danh
      # sách đó, nên cờ này KHÔNG chặn được 64 tài khoản mẫu. Ai biết địa chỉ
      # cũng vào được, kể cả tài khoản quản trị. Chỉ chấp nhận được vì đây là
      # dữ liệu giả. Trước khi có dữ liệu thật, đổi mật khẩu bằng
      # backend/scripts/set_password.py.
      - key: ALLOW_DEMO_ACCOUNTS
        value: "false"
